# Builds, verifies, and publishes a BrightFX release.
#
# A pushed tag vX.Y.Z publishes release X.Y.Z. Every version in the repo
# must already say X.Y.Z (core/scripts/check-version.sh); releases are
# lockstep. The annotated tag's message becomes the release notes. The
# version job refuses a lightweight tag and a tag on a commit that is not on
# main, before anything builds. publish refuses a tag moved off the commit
# the assets were built from, and any release that already exists for the
# tag, draft or published.
#
# Every run builds and verifies every artifact, and the assemble job checks
# the merged set is exactly the release assets and checksums it. A pull
# request skips smoke-all.sh and the Windows cargo test: smoke.yml runs both
# on the same commit. Tag and dispatch runs keep them. Only a tag
# ref reaches publish: a manual (workflow_dispatch) run on a tag ref
# publishes, which is the retry path; a manual run on a branch, like a pull
# request that touches the release machinery, is a dry run.
#
# Build logic lives in core/scripts/, not here. The verify step replays the
# Node, Swift, and C# harnesses against the exact files that get uploaded,
# so a release exists only if its artifacts reproduced the fixtures.
#
# Setup, and every toolchain and tool pin, lives in the composite action
# .github/actions/setup-brightfx (rustc in rust-toolchain.toml), shared
# with smoke.yml, so a dry run and the tag run build with the same tools.
# It keeps the two rules smoke.yml documents: never set
# BRIGHTFX_REGENERATE, and keep cbindgen pinned. A tag run restores no
# caches: no cached objects or tools from earlier runs flow into published
# assets.
#
# Third-party and actions/* steps are pinned by full commit SHA, with the
# release tag in a comment. Dependabot (.github/dependabot.yml) proposes
# the bumps.

name: release

on:
  push:
    tags: ["v[0-9]*"]
  pull_request:
    # Anything a release asset is built or verified from.
    paths:
      - .github/workflows/release.yml
      - .cargo/**
      - LICENSE
      - core/**
      - packages/**
      - presets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    name: Versions are lockstep and match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only Node, for check-version.sh; no Rust toolchain needed. Keep the
      # version in step with .github/actions/setup-brightfx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$(./core/scripts/check-version.sh "$GITHUB_REF_NAME")"
          else
            version="$(./core/scripts/check-version.sh)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release $version"

      # Fail a bad tag before anything builds. checkout can fetch a tag as a
      # lightweight copy; fetch the tag object itself. A release needs an
      # annotated tag: its message is the release notes.
      - name: Tag is annotated
        if: github.ref_type == 'tag'
        run: |
          tag="refs/tags/$GITHUB_REF_NAME"
          git fetch --force origin "$tag:$tag"
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; releases need an annotated tag (git tag -a)." >&2
            exit 1
          fi

      # checkout is shallow, so unshallow before asking whether main
      # contains the tagged commit.
      - name: Tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          main=+refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch -q --unshallow origin "$main"
          else
            git fetch -q origin "$main"
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; tag a commit that has merged." >&2
            exit 1
          fi

  macos:
    name: macOS assets, built and verified
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The universal xcframework needs both Apple slices. No Remotion
      # cache: build-release-macos.sh's npm ci deletes node_modules/.remotion
      # before the post-job save, so the cache could never be saved.
      - uses: ./.github/actions/setup-brightfx
        with:
          cache: ${{ github.ref_type != 'tag' }}
          extra-targets: aarch64-apple-darwin x86_64-apple-darwin
          wasm-tools: "true"
          node: "true"

      # smoke-all.sh runs cargo without --locked and would quietly rewrite a
      # stale Cargo.lock before the release build's --locked could see it.
      - name: Cargo.lock is current
        run: cargo metadata --manifest-path core/Cargo.toml --locked --format-version 1 >/dev/null

      # The full verification first: Rust tests, header and fixture guards,
      # every harness, the package tests. Then build the assets and replay
      # the harnesses against them. Skipped on a pull request: smoke.yml
      # runs it on the same commit. Tag and dispatch runs keep it.
      - name: smoke-all.sh
        if: github.event_name != 'pull_request'
        run: ./core/scripts/smoke-all.sh

      - name: Build release assets
        run: ./core/scripts/build-release-macos.sh dist

      - name: Verify the built assets
        run: ./core/scripts/verify-release-macos.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows DLL, built and verified
    needs: version
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-brightfx
        with:
          cache: ${{ github.ref_type != 'tag' }}
          node: "true"

      # Skipped on a pull request, like smoke-all.sh on macOS. The build
      # script's C# harness below still runs on every event.
      - name: Rust tests
        if: github.event_name != 'pull_request'
        run: cargo test --manifest-path core/Cargo.toml --locked

      - name: Build the DLL zip (runs the C# harness against the DLL first)
        run: ./core/scripts/build-release-windows.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  # Runs on every event, so a pull request or a branch run exercises the
  # download, merge, exact-asset check, and checksums that a tag relies on.
  assemble:
    name: Assemble the release assets
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Only the two build jobs' artifacts: on "Re-run all jobs" the run
      # still holds release-assets from the earlier attempt, which an
      # unfiltered download would merge in.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-{macos,windows}
          path: dist
          merge-multiple: true

      # Upload exactly the assets the build jobs verified, nothing else.
      - name: Exactly the expected assets
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          expected="$(printf '%s\n' \
            "brightfx-wasm-web-$VERSION.tgz" \
            "brightfx-wasm-nodejs-$VERSION.tgz" \
            "brightfx-js-$VERSION.tgz" \
            "brightfx-remotion-$VERSION.tgz" \
            BrightFX.xcframework.zip \
            brightfx_ffi-windows-x64.zip \
            brightfx.h | sort)"
          # shellcheck disable=SC2012 # the names are fixed ASCII
          actual="$(ls -1 | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ does not hold exactly the release assets." >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checkout can fetch a tag as a lightweight copy, dropping its message;
      # fetch the tag object itself, whose message is the release notes. The
      # version job already refused a lightweight tag and a commit not on
      # main. The tag must still name the commit the assets were built from,
      # in case it was moved during the run.
      - name: Release notes from the annotated tag
        run: |
          tag="refs/tags/$GITHUB_REF_NAME"
          git fetch --force origin "$tag:$tag"
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; releases need an annotated tag (git tag -a)." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME no longer points at $GITHUB_SHA, the commit these assets were built from." >&2
            exit 1
          fi
          # On-main check: see the version job's "Tagged commit is on main".
          # subject and body, not %(contents), which includes a signed tag's signature
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      # Not a draft: consumers pin an exact tag, so publishing promotes
      # nothing. The notes are the annotated tag's message, read in the
      # earlier step. Refuses if any release already exists for the tag,
      # published or a draft left by an interrupted run, and changes nothing:
      # deleting a published release's tag turns it back into a draft, so
      # finishing a draft could overwrite a public release, and a rebuild is
      # not byte-identical. A failed API call fails the step (bash -e), so
      # an error is never read as "no release".
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          if [ -n "$existing" ]; then
            echo "::error::a release for $GITHUB_REF_NAME already exists (published, or a draft left by an interrupted run). Nothing was changed. Delete a leftover draft by hand and re-run; never re-release a published version, cut a new one. Release id(s): ${existing//$'\n'/ }" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "BrightFX $GITHUB_REF_NAME" \
            --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
