[package]
name = "brightfx-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

[features]
default = ["render"]
render = []

[[example]]
name = "render_bench"
required-features = ["render"]

[dev-dependencies]
brightfx-test-support = { path = "../brightfx-test-support" }
