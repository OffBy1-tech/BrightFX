language = "C"
include_guard = "BRIGHTFX_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from brightfx-ffi. Do not edit by hand; run core/scripts/gen-header.sh. */"
documentation = true
documentation_style = "doxy"
cpp_compat = true

# An envelope a caller drops is leaked, so compilers that can warn about an
# unused result do. MSVC has no such attribute; there the macro is empty.
after_includes = """
#if defined(__GNUC__) || defined(__clang__)
#define BFX_MUST_USE __attribute__((warn_unused_result))
#else
#define BFX_MUST_USE
#endif"""

[fn]
must_use = "BFX_MUST_USE"

[export]
include = ["BfxSimulation"]

[parse]
parse_deps = false
